
version: 2 

models: 
    - name: stg_rate
      columns: 
        - name: rate_id
          tests:
            - unique
            - not null
        - name: rate_code            
          tests:
            - accepted_values:
                values: 
                  - 'Standard rate'
                  - 'JFK'
                  - 'Newark'
                  - 'Nassau or Westchester'
                  - 'Negotiated fare'
                  - 'Group ride'
