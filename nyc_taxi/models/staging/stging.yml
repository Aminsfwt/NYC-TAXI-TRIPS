
version: 2 

models: 
    - name: stg_rate
      description: The final rate code in effect at the end of the trip 
                   (1= Standard rate; 2= JFK; 3= Newark; 4= Nassau or Westchester; 5= Negotiated fare; 6= Group ride)
      columns: 
        - name: rate_id
          description: primary key
          tests:
            - unique
            - not_null
        - name: rate_code            
          description: rate name 
         

    - name: stg_payments
      description: A numeric code signifying how the passenger paid for the trip 
                   (1= Credit card; 2= Cash; 3= No charge; 4= Dispute; 5= Unknown; 6= Voided trip)
      columns: 
        - name: payment_id
          description: primary key
          tests:
            - unique
            - not_null
        - name: payment_method            
          description: payment type  
          tests:
            - accepted_values:
                values:
                  - 'Credit card'
                  - 'Cash'
                  - 'No charge'
                  - 'Dispute'
                  - 'Unknown'
                  - 'Voided trip' 

    - name: stg_taxi_zones
      description: locations where the passengers ride or delevered
      columns:
      - name: LocationID
        description: primary key
        tests:
            - unique
            - not_null
      - name: Borough
        description: The New York City borough (or area) where the zone is located. 
                    Possible values:Manhattan,Brooklyn,Queens,Bronx,Staten Island,EWR (Newark Airport–treated separately),
                    Unknown (for zones 264 and 265, which are catch-all for invalid/missing locations)
      - name: Zone
        description: The common or official name of the neighborhood or area (e.g., "Astoria", "Central Park", 
                     "JFK Airport", "Upper East Side North").This is the human-readable description of the zone. 
                     Some zones cover parks, airports, or other special areas.
      - name: service_zone  
        description: Categorizes the zone based on taxi service rules and fare types. 
                      Possible values and their meanings:Yellow Zone – Areas where yellow (street-hail) 
                      taxis are allowed to pick up passengers on the street. Almost exclusively in Manhattan south of 96th St
                      on the East Side and 110th St on the West Side, plus the airports.Boro Zone – 
                      The rest of NYC (outer boroughs and upper Manhattan). Street-hail yellow taxis are generally not allowed
                      here; green taxis (Boro Taxis) and rideshares operate instead.Airports – JFK Airport (132) 
                      and LaGuardia Airport (138).EWR – Newark Liberty International Airport (LocationID 1) – special case, 
                      outside NYC but included for trips to/from it.N/A – Used for the two "Unknown" catch-all zones (264 and 265).           
    
    - name: stg_trip_types
      description: tye of the trip
      columns:
      - name: trip_type_id
        description: primary key
        tests:
            - unique
            - not_null
      - name: trip_type
        description: A code indicating whether the trip was a street-hail or a dispatch 
                     that is automatically assigned based on the metered rate in use but can be altered by
                     the driver (1= Street-hail; 2= Dispatch).
    
    - name: stg_vendors
      description: vendors of the taxies in the City
      columns:
      - name: VendorID
        description: primary key
        tests:
            - unique
            - not_null
      - name:  VendorName                 
        description: A code indicating the LPEP provider that provided the record 
                     (1= Creative Mobile Technologies, LLC; 2= Verifone Inc.)
    
    - name: stg_taxi_trips
      description: description of the process
      columns:
      - name: trip_info_id
        description: primary key
        tests:
            - unique
            - not_null
      - name: lpep_pickup_datetime
        description: The date and time when the meter was engaged
      - name: lpep_dropoff_datetime
        description: The date and time when the meter was disengaged
      - name: store_and_fwd_flag
        description: This flag indicates whether the trip record was held in vehicle memory before sending to 
                     the vendor, aka “store and forward,” because the vehicle did not have a connection to 
                     the server (Y= store and forward trip; N= not a store and forward trip)                    
      - name: passenger_count
        description: The number of passengers in the vehicle (this is a driver entered value)
      - name: trip_distance
        description: The elapsed trip distance in miles reported by the taximeter
      - name: fare_amount
        description: The time-and-distance fare calculated by the meter
      - name: extra
        description: Miscellaneous extras and surcharges (this only includes the $0.50 and $1 rush hour 
                     and overnight charges)    
      - name: mta_tax
        description: $0.50 MTA tax that is automatically triggered based on the metered rate in use
      - name: tip_amount
        description: Tip amount (automatically populated for credit card tips - cash tips are not included)
      - name: tolls_amount
        description: Total amount of all tolls paid in trip
      - name: improvement_surcharge
        description: $0.30 improvement surcharge assessed on hailed trips at the flag drop
      - name: total_amount
        description: The total amount charged to passengers (does not include cash tips)
	
	

	
	
	
	
	
	
	
	
	
